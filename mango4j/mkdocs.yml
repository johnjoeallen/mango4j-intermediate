site_name: mango4j
site_description: Small, focused Java libraries, with Spring Boot support modules
site_url: https://bitstep-ie.github.io/mango4j/
repo_url: https://github.com/bitstep-ie/mango4j
repo_name: bitstep-ie/mango4j
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Core:
      - Overview: mango4j-core.md
  - Spring:
      - Overview: mango4j-spring.md
      - Logging:
          - mango4j-spring/mango4j-spring-logging.md
          - Basic annotations: mango4j-spring/mango4j-spring-logging/annotations-basic.md
          - Custom config: mango4j-spring/mango4j-spring-logging/custom-config.md
          - Web context populators: mango4j-spring/mango4j-spring-logging/webcontext-populators.md
      - Insights:
          - mango4j-spring/mango4j-spring-insights.md
          - Basic annotations: mango4j-spring/mango4j-spring-insights/annotations-basic.md
          - Custom config: mango4j-spring/mango4j-spring-insights/custom-config.md
      - Version compatibility: mango4j-spring/version-compatibility.md
      - Change log: mango4j-spring/changelog.md
