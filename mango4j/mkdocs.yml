site_name: mango4j
site_description: Small, focused Java libraries, with Spring Boot support modules
site_url: https://bitstep-ie.github.io/mango4j/
repo_url: https://github.com/bitstep-ie/mango4j
repo_name: bitstep-ie/mango4j
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

extra:
  version:
    provider: mike
    default: latest

nav:
  - Home: index.md
  - Modules: mango4j-core.md
